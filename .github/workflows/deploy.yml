name: Build & Deploy to Run:ai

on:
  push:
    branches:
      - main
      - dev
      - feature/nvidia-rag
  workflow_dispatch: # allow manual trigger from any branch in GitHub UI

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ORG: contzokas
  NIM_IMAGE: nvcr.io/nim/nvidia/nemotron-3-super-120b-a12b:latest
  NIM_EMBED_IMAGE: nvcr.io/nim/nvidia/nv-embedqa-e5-v5:latest
  RUNAI_CLUSTER_URL: https://runai.kiefersa.gr
  RUNAI_PROJECT: medo
  RUNAI_CLUSTER_ID: 0403162b-5439-4561-b986-332482767449
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 0: Resolve branch → image tag + workload suffix
  #   main               → tag=latest  suffix=""
  #   dev                → tag=dev     suffix="-dev"
  #   feature/nvidia-rag → tag=test    suffix="-test"
  #   any other branch   → tag=test    suffix="-test"
  # ─────────────────────────────────────────────────────────────────────────
  setup:
    name: Resolve deployment environment
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      suffix: ${{ steps.resolve.outputs.suffix }}
      env: ${{ steps.resolve.outputs.env }}
      sha_short: ${{ steps.resolve.outputs.sha_short }}
      immutable_tag: ${{ steps.resolve.outputs.immutable_tag }}
      redeploy_ai: ${{ steps.extract.outputs.redeploy_ai }}
    steps:
      - name: Resolve tag and suffix from branch
        id: resolve
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "Branch: $BRANCH"

          if [ "$BRANCH" = "main" ]; then
            TAG="latest"
            SUFFIX=""
            ENV="production"
          elif [ "$BRANCH" = "dev" ]; then
            TAG="dev"
            SUFFIX="-dev"
            ENV="development"
          else
            TAG="test"
            SUFFIX="-test"
            ENV="test"
          fi

          SHA_SHORT="${GITHUB_SHA::7}"
          IMMUTABLE_TAG="${TAG}-${SHA_SHORT}"

          echo "tag=$TAG"                         >> $GITHUB_OUTPUT
          echo "suffix=$SUFFIX"                   >> $GITHUB_OUTPUT
          echo "env=$ENV"                         >> $GITHUB_OUTPUT
          echo "sha_short=$SHA_SHORT"             >> $GITHUB_OUTPUT
          echo "immutable_tag=$IMMUTABLE_TAG"     >> $GITHUB_OUTPUT

          echo "──────────────────────────────────"
          echo "  Branch : $BRANCH"
          echo "  Tag    : $TAG"
          echo "  SHA    : $SHA_SHORT"
          echo "  Deploy : $IMMUTABLE_TAG"
          echo "  Suffix : ${SUFFIX:-(none)}"
          echo "  Env    : $ENV"
          echo "──────────────────────────────────"

      - name: Check for redeploy-ai flag in commit message
        id: extract
        run: |
          MSG="${{ github.event.head_commit.message }}"
          TITLE=$(echo "$MSG" | head -1)
          echo "Commit title: $TITLE"
          if echo "$TITLE" | grep -qiE '\(redeploy-ai\)'; then
            echo "Flag (redeploy-ai) detected — NIM instances will be redeployed"
            echo "redeploy_ai=true" >> $GITHUB_OUTPUT
          else
            echo "No (redeploy-ai) flag in commit title"
            echo "redeploy_ai=false" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Jobs 1-2: Build images in parallel
  # ─────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build backend → :${{ needs.setup.outputs.tag }}
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/medw-backend
          tags: |
            type=raw,value=${{ needs.setup.outputs.tag }}
            type=raw,value=${{ needs.setup.outputs.immutable_tag }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build frontend → :${{ needs.setup.outputs.tag }}
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/medw-frontend
          tags: |
            type=raw,value=${{ needs.setup.outputs.tag }}
            type=raw,value=${{ needs.setup.outputs.immutable_tag }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy via Run:ai REST API
  #
  # Workload names are suffixed by branch:
  #   feature/nvidia-rag → medw-nim-test, medw-backend-test, ...
  #   dev                → medw-nim-dev,  medw-backend-dev,  ...
  #   main               → medw-nim,       medw-backend,       ...
  #
  # GPU strategy:
  #   GPU 1+2 (full 2×): NIM LLM (tensor parallel)
  #   GPU 3 (1×):        NIM Embed
  #   CPU only:          backend, frontend
  #
  # Required secrets:
  #   RUNAI_CLIENT_ID / RUNAI_CLIENT_SECRET — Run:ai → Settings → Application
  #   NGC_API_KEY                           — NVIDIA NGC
  #   VPN_CONFIG / VPN_USERNAME / VPN_PASSWORD
  #
  # Required pre-created PVCs (created once, reused across deploys):
  #   nim-pvc       500Gi — NIM LLM model cache
  #   nim-embed-pvc  20Gi — NIM Embed model cache
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy [${{ needs.setup.outputs.env }}] to Run:ai (medo)
    runs-on: ubuntu-latest
    needs: [setup, build-backend, build-frontend]
    environment: ${{ needs.setup.outputs.env }}
    permissions:
      contents: read
      actions: write # required for cancel-in-progress and environment variable updates
    env:
      TAG: ${{ needs.setup.outputs.tag }}
      SUFFIX: ${{ needs.setup.outputs.suffix }}
      SHA_SHORT: ${{ needs.setup.outputs.sha_short }}
      IMMUTABLE_TAG: ${{ needs.setup.outputs.immutable_tag }}
      REDEPLOY_AI: ${{ needs.setup.outputs.redeploy_ai }}
      NIM_MODEL: ${{ vars.NIM_MODEL || 'nvidia/nemotron-3-super-120b-a12b' }}
      NIM_TIMEOUT: ${{ vars.NIM_TIMEOUT || '120' }}
      NIM_WARMUP_ENABLED: ${{ vars.NIM_WARMUP_ENABLED || 'true' }}
      NIM_WARMUP_RETRIES: ${{ vars.NIM_WARMUP_RETRIES || '120' }}
      NIM_WARMUP_RETRY_DELAY_SECONDS: ${{ vars.NIM_WARMUP_RETRY_DELAY_SECONDS || '25' }}
      NIM_EMBED_MODEL: nvidia/nv-embedqa-e5-v5
      NIM_RERANKER_MODEL: nvidia/nv-rerankqa-llama-3_2-1b-v2
      RAG_DEBUG_ENABLED: ${{ vars.RAG_DEBUG_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4

      # ── VPN ───────────────────────────────────────────────────────────────
      - name: Install OpenVPN
        run: sudo apt-get update -qq && sudo apt-get install -y openvpn resolvconf

      - name: Write VPN config
        run: echo "${{ secrets.VPN_CONFIG }}" > /tmp/vpn.ovpn

      - name: Connect to VPN
        uses: kota65535/github-openvpn-connect-action@v3.1.0
        with:
          config_file: /tmp/vpn.ovpn
          username: ${{ secrets.VPN_USERNAME }}
          password: ${{ secrets.VPN_PASSWORD }}

      - name: Add Run:ai host entry
        run: echo "10.184.94.250 runai.kiefersa.gr" | sudo tee -a /etc/hosts

      # ── Auth ──────────────────────────────────────────────────────────────
      - name: Authenticate and resolve project
        env:
          RUNAI_CLIENT_ID: ${{ secrets.RUNAI_CLIENT_ID }}
          RUNAI_CLIENT_SECRET: ${{ secrets.RUNAI_CLIENT_SECRET }}
        run: |
          TOKEN=$(curl -fsSL --max-time 30 -X POST \
            "${{ env.RUNAI_CLUSTER_URL }}/api/v1/token" \
            -H "Accept: */*" \
            -H "Content-Type: application/json" \
            -d "{\"grantType\":\"client_credentials\",\"clientId\":\"$RUNAI_CLIENT_ID\",\"clientSecret\":\"$RUNAI_CLIENT_SECRET\"}" \
            | jq -r '.accessToken')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain access token"; exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Token obtained ($(echo -n "$TOKEN" | wc -c) chars)"

          PROJECT_RESP=$(curl -fsSL --max-time 30 \
            "${{ env.RUNAI_CLUSTER_URL }}/api/v1/org-unit/projects" \
            -H "Authorization: Bearer $TOKEN")
          PROJECT_ID=$(echo "$PROJECT_RESP" | jq -r '.projects[] | select(.name == "${{ env.RUNAI_PROJECT }}") | .id')
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "Failed to find project ${{ env.RUNAI_PROJECT }}"; exit 1
          fi
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "Project: ${{ env.RUNAI_PROJECT }} → $PROJECT_ID"

      # ── Show plan ─────────────────────────────────────────────────────────
      - name: Show deployment plan
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Environment : ${{ needs.setup.outputs.env }}"
          echo "  Branch      : ${{ github.ref_name }}"
          echo "  Image tag   : ${{ env.TAG }}"
          echo "  Immutable   : ${{ env.IMMUTABLE_TAG }}"
          echo "  Suffix      : ${{ env.SUFFIX }}"
          echo "  Cluster     : ${{ env.RUNAI_CLUSTER_ID }}"
          echo "  Project     : ${{ env.RUNAI_PROJECT }} ($PROJECT_ID)"
          echo "  Workloads   :"
          echo "    medw-nim${{ env.SUFFIX }}       (GPU 1+2 — LLM tensor parallel)"
          echo "    medw-nim-embed${{ env.SUFFIX }} (GPU 3 — embedding NIM)"
          echo "    medw-backend${{ env.SUFFIX }}   (CPU — Milvus Lite embedded)"
          echo "    medw-frontend${{ env.SUFFIX }}  (CPU)"
          echo "  Reranker    : $NIM_RERANKER_BASE_URL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── Delete stale workloads ────────────────────────────────────────────
      - name: Delete existing workloads
        run: |
          delete_workload() {
            local name="$1"
            echo "Deleting workload: $name"
            RESP=$(curl -sSL --max-time 30 \
              "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads?limit=100" \
              -H "Authorization: Bearer $TOKEN")
            WL_ID=$(echo "$RESP" | jq -r ".workloads // . | .[]? | objects | select(.name ==\"$name\") | .id // empty")
            if [ -z "$WL_ID" ] || [ "$WL_ID" = "null" ]; then
              echo "  $name not found — nothing to delete"; return 0
            fi
            curl -sSL --max-time 30 -X DELETE \
              "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads/workspaces/$WL_ID" \
              -H "Authorization: Bearer $TOKEN" || true
            for i in $(seq 1 30); do
              CHECK=$(curl -sSL --max-time 30 \
                "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads?limit=100" \
                -H "Authorization: Bearer $TOKEN" | jq -r ".workloads // . | .[]? | objects | select(.name ==\"$name\") | .phase // empty")
              [ -z "$CHECK" ] && echo "  $name removed" && return 0
              echo "  [$i] $name phase: $CHECK — waiting..."; sleep 5
            done
            echo "  WARNING: $name not removed after 150s — proceeding"
          }

          if [ "$REDEPLOY_AI" = "true" ]; then
            echo "(redeploy-ai) flag detected — deleting NIM workloads for fresh redeploy"
            delete_workload "medw-nim${SUFFIX}"
            delete_workload "medw-nim-embed${SUFFIX}"
          else
            echo "No (redeploy-ai) flag — preserving existing NIM workloads"
          fi
          delete_workload "medw-milvus${SUFFIX}"         # legacy cleanup from previous runs
          delete_workload "medw-milvus-etcd${SUFFIX}"    # legacy cleanup from previous runs
          delete_workload "medw-milvus-minio${SUFFIX}"   # legacy cleanup from previous runs
          delete_workload "medw-backend${SUFFIX}"
          delete_workload "medw-frontend${SUFFIX}"

      # ── Submit GPU workloads ─────────────────────────────────────────────
      - name: Deploy NIM LLM (GPU 1+2 — tensor parallel)
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        run: |
          # Check if NIM LLM workload already exists — skip if already running
          EXISTING=$(curl -sSL --max-time 30 \
            "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads?limit=100" \
            -H "Authorization: Bearer $TOKEN" | jq -r ".workloads // . | .[]? | objects | select(.name ==\"medw-nim${SUFFIX}\") | .name // empty")
          if [ -n "$EXISTING" ]; then
            echo "NIM LLM workload already exists — skipping deploy"
            exit 0
          fi
          PAYLOAD=$(jq -n \
            --arg name "medw-nim${SUFFIX}" \
            --arg projectId "$PROJECT_ID" \
            --arg clusterId "${{ env.RUNAI_CLUSTER_ID }}" \
            --arg image "${{ env.NIM_IMAGE }}" \
            --arg ngcApiKey "$NGC_API_KEY" \
            '{
              name: $name, projectId: $projectId, clusterId: $clusterId,
              spec: {
                image: $image,
                imagePullSecrets: [{name: "dockerregistry-nvcr-io"}],
                compute: { cpuCoreRequest: 24, cpuCoreLimit: 24, cpuMemoryRequest: "96G", cpuMemoryLimit: "96G", gpuDevicesRequest: 2 },
                environmentVariables: [
                  {name: "NGC_API_KEY",    value: $ngcApiKey},
                  {name: "NIM_CACHE_PATH", value: "/opt/nim/.cache"}
                ],
                ports: [{container: 8000, serviceType: "NodePort"}],
                storage: { pvc: [{ path: "/opt/nim/.cache", claimName: "nim-pvc", existingPvc: false, claimInfo: { size: "500Gi" } }] }
              }
            }')
          RESP=$(curl -sSL --max-time 30 -w "\n%{http_code}" -X POST \
            "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads/workspaces" \
            -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" \
            -d "$PAYLOAD") || true
          STATUS=$(echo "$RESP" | tail -1); BODY=$(echo "$RESP" | head -n -1)
          echo "NIM LLM (HTTP $STATUS): $BODY"
          { [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; } || { echo "NIM LLM failed"; exit 1; }

      - name: Deploy NIM Embed (GPU 3 — embedding)
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        run: |
          # Check if NIM Embed workload already exists — skip if already running
          EXISTING=$(curl -sSL --max-time 30 \
            "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads?limit=100" \
            -H "Authorization: Bearer $TOKEN" | jq -r ".workloads // . | .[]? | objects | select(.name ==\"medw-nim-embed${SUFFIX}\") | .name // empty")
          if [ -n "$EXISTING" ]; then
            echo "NIM Embed workload already exists — skipping deploy"
            exit 0
          fi
          PAYLOAD=$(jq -n \
            --arg name "medw-nim-embed${SUFFIX}" \
            --arg projectId "$PROJECT_ID" \
            --arg clusterId "${{ env.RUNAI_CLUSTER_ID }}" \
            --arg image "${{ env.NIM_EMBED_IMAGE }}" \
            --arg ngcApiKey "$NGC_API_KEY" \
            '{
              name: $name, projectId: $projectId, clusterId: $clusterId,
              spec: {
                image: $image,
                imagePullSecrets: [{name: "dockerregistry-nvcr-io"}],
                compute: { cpuCoreRequest: 4, cpuCoreLimit: 4, cpuMemoryRequest: "8G", cpuMemoryLimit: "8G", gpuDevicesRequest: 1 },
                environmentVariables: [
                  {name: "NGC_API_KEY",    value: $ngcApiKey},
                  {name: "NIM_CACHE_PATH", value: "/opt/nim/.cache"}
                ],
                ports: [{container: 8000, serviceType: "NodePort"}],
                storage: { pvc: [{ path: "/opt/nim/.cache", claimName: "nim-embed-pvc", existingPvc: false, claimInfo: { size: "20Gi" } }] }
              }
            }')
          RESP=$(curl -sSL --max-time 30 -w "\n%{http_code}" -X POST \
            "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads/workspaces" \
            -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" \
            -d "$PAYLOAD") || true
          STATUS=$(echo "$RESP" | tail -1); BODY=$(echo "$RESP" | head -n -1)
          echo "NIM Embed (HTTP $STATUS): $BODY"
          { [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; } || { echo "NIM Embed failed"; exit 1; }

      # ── Resolve NIM service URLs ──────────────────────────────────────────
      - name: Resolve NIM service URLs
        run: |
          resolve_url() {
            local name="$1" scheme="${2:-http}" max=120
            echo "━━━ Resolving $name ━━━" >&2
            for i in $(seq 1 $max); do
              local wl=$(curl -sSL --max-time 30 \
                "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads?limit=100" \
                -H "Authorization: Bearer $TOKEN" | jq ".workloads // . | .[]? | objects | select(.name ==\"$name\")")
              local phase=$(echo "$wl" | jq -r '.phase // "Unknown"')
              local url=$(echo "$wl" | jq -r '.urls[0] // .environments[0].connections[0].url // empty')
              echo "  [$i] $name: $phase" >&2
              if [ "$phase" = "Failed" ] || [ "$phase" = "Error" ]; then
                echo "  ERROR: $name entered phase $phase" >&2
                return 1
              fi
              if [ -n "$url" ] && [ "$url" != "null" ]; then
                echo "  [$i] $name URL available (phase=$phase) — proceeding" >&2
                if [[ "$url" == http://* || "$url" == https://* ]]; then
                  echo "$url"
                else
                  echo "${scheme}://${url}"
                fi
                return 0
              fi
              sleep 5
            done
            echo "  ERROR: $name timed out" >&2; return 1
          }

          NIM_URL=$(resolve_url   "medw-nim${SUFFIX}")       || NIM_URL=""
          EMBED_URL=$(resolve_url "medw-nim-embed${SUFFIX}") || EMBED_URL=""
          RERANKER_URL=$(resolve_url "medw-nim-reranker${SUFFIX}") || RERANKER_URL=""
          # Reranker is optional — fall back to retrieval order if unavailable
          if [ -n "$RERANKER_URL" ]; then
            echo "NIM_RERANKER_BASE_URL=${RERANKER_URL}/v1" >> "$GITHUB_ENV"
          else
            echo "NIM_RERANKER_BASE_URL=" >> "$GITHUB_ENV"
          fi

          [ -z "$NIM_URL" ]   && NIM_URL="${{ vars.NIM_URL }}"
          [ -z "$EMBED_URL" ] && EMBED_URL="${{ vars.NIM_EMBED_URL }}"

          if [ -z "$NIM_URL" ] || [ -z "$EMBED_URL" ]; then
            echo "Failed to resolve NIM/Embed URLs"; exit 1
          fi

          echo "NIM_BASE_URL=${NIM_URL}/v1"               >> "$GITHUB_ENV"
          echo "NIM_EMBED_BASE_URL=${EMBED_URL}/v1"       >> "$GITHUB_ENV"
          echo "NIM LLM:     ${NIM_URL}/v1"
          echo "Embed:       ${EMBED_URL}/v1"
          echo "Reranker:    ${RERANKER_URL:-not deployed}"

      - name: Deploy Backend
        run: |
          BACKEND_JSON=$(jq -n \
            --arg name "medw-backend${SUFFIX}" \
            --arg projectId "$PROJECT_ID" \
            --arg clusterId "${{ env.RUNAI_CLUSTER_ID }}" \
            --arg image "${{ env.REGISTRY }}/${{ env.ORG }}/medw-backend:${IMMUTABLE_TAG}" \
            --arg nimBaseUrl "$NIM_BASE_URL" \
            --arg nimModel "${NIM_MODEL}" \
            --arg nimTimeout "${NIM_TIMEOUT}" \
            --arg nimWarmupEnabled "${NIM_WARMUP_ENABLED}" \
            --arg nimWarmupRetries "${NIM_WARMUP_RETRIES}" \
            --arg nimWarmupRetryDelaySecs "${NIM_WARMUP_RETRY_DELAY_SECONDS}" \
            --arg nimEmbedBaseUrl "$NIM_EMBED_BASE_URL" \
            --arg nimEmbedModel "${NIM_EMBED_MODEL}" \
            --arg nimRerankerBaseUrl "${NIM_RERANKER_BASE_URL}" \
            --arg nimRerankerModel "${NIM_RERANKER_MODEL}" \
            --arg ngcApiKey "${{ secrets.NGC_API_KEY }}" \
            --arg ragDebugEnabled "${RAG_DEBUG_ENABLED}" \
            '{
              name: $name, projectId: $projectId, clusterId: $clusterId,
              spec: {
                image: $image,
                compute: { cpuCoreRequest: 1, cpuCoreLimit: 1, cpuMemoryRequest: "1G", cpuMemoryLimit: "1G" },
                environmentVariables: [
                  {name: "NIM_BASE_URL",             value: $nimBaseUrl},
                  {name: "NIM_MODEL",                value: $nimModel},
                  {name: "NIM_TIMEOUT",              value: $nimTimeout},
                  {name: "NIM_WARMUP_ENABLED",       value: $nimWarmupEnabled},
                  {name: "NIM_WARMUP_RETRIES",       value: $nimWarmupRetries},
                  {name: "NIM_WARMUP_RETRY_DELAY_SECONDS", value: $nimWarmupRetryDelaySecs},
                  {name: "NIM_EMBED_BASE_URL",       value: $nimEmbedBaseUrl},
                  {name: "NIM_EMBED_MODEL",          value: $nimEmbedModel},
                  {name: "NIM_RERANKER_BASE_URL",    value: $nimRerankerBaseUrl},
                  {name: "NIM_RERANKER_MODEL",       value: $nimRerankerModel},
                  {name: "NIM_API_KEY",              value: $ngcApiKey},
                  {name: "MILVUS_DB_PATH",           value: "/tmp/milvus.db"},
                  {name: "RAG_DEBUG_ENABLED",        value: $ragDebugEnabled}
                ],
                ports: [{container: 8000, serviceType: "NodePort"}]
              }
            }')
          RESP=$(curl -sSL --max-time 30 -w "\n%{http_code}" -X POST \
            "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads/workspaces" \
            -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" \
            -d "$BACKEND_JSON") || true
          STATUS=$(echo "$RESP" | tail -1); BODY=$(echo "$RESP" | head -n -1)
          echo "Backend (HTTP $STATUS): $BODY"
          [ "$STATUS" = "409" ] && echo "Backend already exists — delete to apply new env vars" && exit 0
          { [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; } || { echo "Backend failed"; exit 1; }

      - name: Resolve Backend URL
        run: |
          resolve_url() {
            local name="$1" scheme="${2:-http}" max=120
            for i in $(seq 1 $max); do
              local wl=$(curl -sSL --max-time 30 \
                "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads?limit=100" \
                -H "Authorization: Bearer $TOKEN" | jq ".workloads // . | .[]? | objects | select(.name ==\"$name\")")
              local phase=$(echo "$wl" | jq -r '.phase // "Unknown"')
              local url=$(echo "$wl" | jq -r '.urls[0] // .environments[0].connections[0].url // empty')
              echo "  [$i] $name: $phase" >&2
              if [ "$phase" = "Failed" ] || [ "$phase" = "Error" ]; then
                echo "  ERROR: $name entered phase $phase" >&2
                return 1
              fi
              if [ -n "$url" ] && [ "$url" != "null" ]; then
                echo "  [$i] $name URL available (phase=$phase) — proceeding" >&2
                if [[ "$url" == http://* || "$url" == https://* ]]; then
                  echo "$url"
                else
                  echo "${scheme}://${url}"
                fi
                return 0
              fi
              sleep 5
            done
            echo "  ERROR: $name timed out" >&2; return 1
          }

          BACKEND_URL=$(resolve_url "medw-backend${SUFFIX}") || BACKEND_URL=""
          [ -z "$BACKEND_URL" ] && BACKEND_URL="${{ vars.BACKEND_URL }}"
          [ -z "$BACKEND_URL" ] && echo "Failed to resolve backend URL" && exit 1
          echo "BACKEND_URL=$BACKEND_URL" >> "$GITHUB_ENV"
          echo "Resolved BACKEND_URL=$BACKEND_URL"

          ENV_NAME="${{ needs.setup.outputs.env }}"
          REPO="${{ github.repository }}"
          GH_API="https://api.github.com/repos/${REPO}/environments/${ENV_NAME}/variables/BACKEND_URL"
          HTTP=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "$GH_API" -d "{\"name\":\"BACKEND_URL\",\"value\":\"${BACKEND_URL}\"}")
          if [ "$HTTP" = "404" ]; then
            curl -s --max-time 30 -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/environments/${ENV_NAME}/variables" \
              -d "{\"name\":\"BACKEND_URL\",\"value\":\"${BACKEND_URL}\"}"
          fi
          echo "GitHub variable BACKEND_URL updated (HTTP $HTTP)"

      - name: Deploy Frontend
        run: |
          PAYLOAD=$(jq -n \
            --arg name "medw-frontend${SUFFIX}" \
            --arg projectId "$PROJECT_ID" \
            --arg clusterId "${{ env.RUNAI_CLUSTER_ID }}" \
            --arg image "${{ env.REGISTRY }}/${{ env.ORG }}/medw-frontend:${IMMUTABLE_TAG}" \
            --arg backendUrl "$BACKEND_URL" \
            '{
              name: $name, projectId: $projectId, clusterId: $clusterId,
              spec: {
                image: $image,
                compute: { cpuCoreRequest: 1, cpuCoreLimit: 1, cpuMemoryRequest: "512M", cpuMemoryLimit: "512M" },
                environmentVariables: [{name: "BACKEND_URL", value: $backendUrl}],
                ports: [{container: 3000, serviceType: "NodePort"}]
              }
            }')
          RESP=$(curl -sSL --max-time 30 -w "\n%{http_code}" -X POST \
            "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads/workspaces" \
            -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" \
            -d "$PAYLOAD") || true
          STATUS=$(echo "$RESP" | tail -1); BODY=$(echo "$RESP" | head -n -1)
          echo "Frontend (HTTP $STATUS): $BODY"
          [ "$STATUS" = "409" ] && echo "Frontend already exists" && exit 0
          { [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; } || { echo "Frontend failed"; exit 1; }

      - name: Resolve and save Frontend URL
        run: |
          resolve_url() {
            local name="$1" scheme="${2:-http}" max=120
            for i in $(seq 1 $max); do
              local wl=$(curl -sSL --max-time 30 \
                "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads?limit=100" \
                -H "Authorization: Bearer $TOKEN" | jq ".workloads // . | .[]? | objects | select(.name ==\"$name\")")
              local phase=$(echo "$wl" | jq -r '.phase // "Unknown"')
              local url=$(echo "$wl" | jq -r '.urls[0] // .environments[0].connections[0].url // empty')
              echo "  [$i] $name: $phase" >&2
              if [ "$phase" = "Failed" ] || [ "$phase" = "Error" ]; then
                echo "  ERROR: $name entered phase $phase" >&2
                return 1
              fi
              if [ -n "$url" ] && [ "$url" != "null" ]; then
                echo "  [$i] $name URL available (phase=$phase) — proceeding" >&2
                if [[ "$url" == http://* || "$url" == https://* ]]; then
                  echo "$url"
                else
                  echo "${scheme}://${url}"
                fi
                return 0
              fi
              sleep 5
            done
            echo "  ERROR: $name timed out" >&2; return 1
          }

          FRONTEND_URL=$(resolve_url "medw-frontend${SUFFIX}") || FRONTEND_URL=""
          [ -z "$FRONTEND_URL" ] && FRONTEND_URL="${{ vars.FRONTEND_URL }}"
          [ -z "$FRONTEND_URL" ] && echo "WARNING: could not resolve frontend URL" && exit 0
          echo "Resolved FRONTEND_URL=$FRONTEND_URL"

          ENV_NAME="${{ needs.setup.outputs.env }}"
          REPO="${{ github.repository }}"
          GH_API="https://api.github.com/repos/${REPO}/environments/${ENV_NAME}/variables/FRONTEND_URL"
          HTTP=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "$GH_API" -d "{\"name\":\"FRONTEND_URL\",\"value\":\"${FRONTEND_URL}\"}")
          if [ "$HTTP" = "404" ]; then
            curl -s --max-time 30 -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/environments/${ENV_NAME}/variables" \
              -d "{\"name\":\"FRONTEND_URL\",\"value\":\"${FRONTEND_URL}\"}"
          fi
          echo "GitHub variable FRONTEND_URL updated (HTTP $HTTP)"

      # ── Status ────────────────────────────────────────────────────────────
      - name: Show workload status
        if: always()
        run: |
          curl -fsSL --max-time 30 \
            "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads?limit=100" \
            -H "Authorization: Bearer $TOKEN" \
            | jq '.workloads // . | if type == "array" then .[] | select(.name | startswith("medw-")) | {name, phase} else . end'
