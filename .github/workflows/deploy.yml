name: Build & Deploy to Run:ai

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:   # allow manual trigger from any branch in GitHub UI

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ORG: contzokas
  CHROMA_UPSTREAM_IMAGE: chromadb/chroma:1.5.7
  OLLAMA_UPSTREAM_IMAGE: ollama/ollama:latest
  RUNAI_CLUSTER_URL: https://runai.kiefersa.gr
  RUNAI_PROJECT: medo
  RUNAI_CLUSTER_ID: 0403162b-5439-4561-b986-332482767449
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # suppress Node.js 20 deprecation on all actions

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 0: Resolve branch → image tag + workload suffix
  #   main                    → tag=latest  suffix=""
  #   dev                     → tag=dev     suffix="-dev"
  #   feature/deploy-to-runai → tag=test    suffix="-test"
  #   any other branch        → tag=test    suffix="-test"
  # ─────────────────────────────────────────────────────────────────────────
  setup:
    name: Resolve deployment environment
    if: ${{ github.ref_name == 'main' || github.ref_name == 'dev' }}
    runs-on: ubuntu-latest
    outputs:
      tag:            ${{ steps.resolve.outputs.tag }}
      suffix:         ${{ steps.resolve.outputs.suffix }}
      env:            ${{ steps.resolve.outputs.env }}
      sha_short:      ${{ steps.resolve.outputs.sha_short }}
      immutable_tag:  ${{ steps.resolve.outputs.immutable_tag }}
    steps:
      - name: Resolve tag and suffix from branch
        id: resolve
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "Branch: $BRANCH"

          if [ "$BRANCH" = "main" ]; then
            TAG="latest"
            SUFFIX=""
            ENV="production"
          elif [ "$BRANCH" = "dev" ]; then
            TAG="dev"
            SUFFIX="-dev"
            ENV="development"
          else
            TAG="test"
            SUFFIX="-test"
            ENV="test"
          fi

          SHA_SHORT="${GITHUB_SHA::7}"
          IMMUTABLE_TAG="${TAG}-${SHA_SHORT}"

          echo "tag=$TAG"       >> $GITHUB_OUTPUT
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          echo "env=$ENV"       >> $GITHUB_OUTPUT
          echo "sha_short=$SHA_SHORT"         >> $GITHUB_OUTPUT
          echo "immutable_tag=$IMMUTABLE_TAG" >> $GITHUB_OUTPUT

          echo "──────────────────────────────────"
          echo "  Branch : $BRANCH"
          echo "  Tag    : $TAG"
          echo "  SHA    : $SHA_SHORT"
          echo "  Deploy : $IMMUTABLE_TAG"
          echo "  Suffix : ${SUFFIX:-(none)}"
          echo "  Env    : $ENV"
          echo "──────────────────────────────────"

  # ─────────────────────────────────────────────────────────────────────────
  # Job 1-4: Build/mirror images (parallel)
  # ─────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build backend → :${{ needs.setup.outputs.tag }}
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/medw-backend
          tags: |
            type=raw,value=${{ needs.setup.outputs.tag }}
            type=raw,value=${{ needs.setup.outputs.immutable_tag }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build frontend → :${{ needs.setup.outputs.tag }}
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/medw-frontend
          tags: |
            type=raw,value=${{ needs.setup.outputs.tag }}
            type=raw,value=${{ needs.setup.outputs.immutable_tag }}

      # The backend URL is now resolved at runtime via the BACKEND_URL env var
      # and proxied through Next.js rewrites (see frontend/next.config.ts).
      # No build-time NEXT_PUBLIC_API_URL is needed.
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mirror-chromadb:
    name: Mirror chromadb → :${{ needs.setup.outputs.tag }}
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror ChromaDB image to GHCR
        env:
          TARGET_REPO: ${{ env.REGISTRY }}/${{ env.ORG }}/medw-chromadb
          TAG: ${{ needs.setup.outputs.tag }}
          IMMUTABLE_TAG: ${{ needs.setup.outputs.immutable_tag }}
        run: |
          docker pull "${{ env.CHROMA_UPSTREAM_IMAGE }}"
          docker tag "${{ env.CHROMA_UPSTREAM_IMAGE }}" "$TARGET_REPO:$TAG"
          docker tag "${{ env.CHROMA_UPSTREAM_IMAGE }}" "$TARGET_REPO:$IMMUTABLE_TAG"
          docker push "$TARGET_REPO:$TAG"
          docker push "$TARGET_REPO:$IMMUTABLE_TAG"

  mirror-ollama:
    name: Mirror ollama → :${{ needs.setup.outputs.tag }}
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror Ollama image to GHCR
        env:
          TARGET_REPO: ${{ env.REGISTRY }}/${{ env.ORG }}/medw-ollama
          TAG: ${{ needs.setup.outputs.tag }}
          IMMUTABLE_TAG: ${{ needs.setup.outputs.immutable_tag }}
        run: |
          docker pull "${{ env.OLLAMA_UPSTREAM_IMAGE }}"
          docker tag "${{ env.OLLAMA_UPSTREAM_IMAGE }}" "$TARGET_REPO:$TAG"
          docker tag "${{ env.OLLAMA_UPSTREAM_IMAGE }}" "$TARGET_REPO:$IMMUTABLE_TAG"
          docker push "$TARGET_REPO:$TAG"
          docker push "$TARGET_REPO:$IMMUTABLE_TAG"

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy via Run:ai REST API (no CLI needed)
  #
  # Workload names are suffixed by branch:
  #   feature/deploy-to-runai → medw-ollama-test, medw-backend-test, ...
  #   dev                     → medw-ollama-dev,  medw-backend-dev,  ...
  #   main                    → medw-ollama,       medw-backend,       ...
  #
  # Required secrets (Settings → Secrets → Actions):
  #   RUNAI_CLIENT_ID     — from Run:ai → Settings → Application
  #   RUNAI_CLIENT_SECRET — same place
  #   VPN_CONFIG / VPN_USERNAME / VPN_PASSWORD — VPN credentials
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy [${{ needs.setup.outputs.env }}] to Run:ai (medo)
    runs-on: ubuntu-latest
    needs: [setup, build-backend, build-frontend, mirror-chromadb, mirror-ollama]
    environment: ${{ needs.setup.outputs.env }}
    permissions:
      contents: read
      actions: write
    env:
      TAG:           ${{ needs.setup.outputs.tag }}
      SUFFIX:        ${{ needs.setup.outputs.suffix }}
      SHA_SHORT:     ${{ needs.setup.outputs.sha_short }}
      IMMUTABLE_TAG: ${{ needs.setup.outputs.immutable_tag }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'medgemma:27b' }}
      OLLAMA_TIMEOUT: ${{ vars.OLLAMA_TIMEOUT || '120' }}
      OLLAMA_NUM_PARALLEL: ${{ vars.OLLAMA_NUM_PARALLEL || '1' }}
      OLLAMA_MAX_LOADED_MODELS: ${{ vars.OLLAMA_MAX_LOADED_MODELS || '1' }}
      OLLAMA_FLASH_ATTENTION: ${{ vars.OLLAMA_FLASH_ATTENTION || '0' }}
      OLLAMA_WARMUP_ENABLED: ${{ vars.OLLAMA_WARMUP_ENABLED || 'true' }}
      OLLAMA_WARMUP_KEEP_ALIVE: ${{ vars.OLLAMA_WARMUP_KEEP_ALIVE || '30m' }}
      OLLAMA_WARMUP_RETRIES: ${{ vars.OLLAMA_WARMUP_RETRIES || '24' }}
      OLLAMA_WARMUP_RETRY_DELAY_SECONDS: ${{ vars.OLLAMA_WARMUP_RETRY_DELAY_SECONDS || '5' }}
    steps:
      - uses: actions/checkout@v4

      # ── VPN ───────────────────────────────────────────────────────────────
      - name: Install OpenVPN
        run: sudo apt-get update -qq && sudo apt-get install -y openvpn resolvconf

      - name: Write VPN config
        run: echo "${{ secrets.VPN_CONFIG }}" > /tmp/vpn.ovpn

      - name: Connect to VPN
        uses: kota65535/github-openvpn-connect-action@v3.1.0
        with:
          config_file: /tmp/vpn.ovpn
          username: ${{ secrets.VPN_USERNAME }}
          password: ${{ secrets.VPN_PASSWORD }}

      # runai.kiefersa.gr = 10.184.94.250 (private, VPN-only)
      - name: Add Run:ai host entry
        run: echo "10.184.94.250 runai.kiefersa.gr" | sudo tee -a /etc/hosts

      # ── Auth (REST API, no CLI) ──────────────────────────────────────────
      - name: Authenticate and resolve project
        env:
          RUNAI_CLIENT_ID:     ${{ secrets.RUNAI_CLIENT_ID }}
          RUNAI_CLIENT_SECRET: ${{ secrets.RUNAI_CLIENT_SECRET }}
        run: |
          TOKEN=$(curl -fsSL -X POST \
            "${{ env.RUNAI_CLUSTER_URL }}/api/v1/token" \
            -H "Accept: */*" \
            -H "Content-Type: application/json" \
            -d "{\"grantType\":\"client_credentials\",\"clientId\":\"$RUNAI_CLIENT_ID\",\"clientSecret\":\"$RUNAI_CLIENT_SECRET\"}" \
            | jq -r '.accessToken')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain access token"; exit 1
          fi
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Token obtained ($(echo -n "$TOKEN" | wc -c) chars)"

          # Resolve project UUID by name
          PROJECT_RESP=$(curl -fsSL "${{ env.RUNAI_CLUSTER_URL }}/api/v1/org-unit/projects" \
            -H "Authorization: Bearer $TOKEN")
          echo "DEBUG projects response: $PROJECT_RESP"
          PROJECT_ID=$(echo "$PROJECT_RESP" | jq -r '.projects[] | select(.name == "${{ env.RUNAI_PROJECT }}") | .id')
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "Failed to find project ${{ env.RUNAI_PROJECT }}"; exit 1
          fi
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "Project: ${{ env.RUNAI_PROJECT }} → $PROJECT_ID"

      # ── Show plan ─────────────────────────────────────────────────────────
      - name: Show deployment plan
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Environment : ${{ needs.setup.outputs.env }}"
          echo "  Branch      : ${{ github.ref_name }}"
          echo "  Image tag   : ${{ env.TAG }}"
          echo "  Immutable   : ${{ env.IMMUTABLE_TAG }}"
          echo "  Suffix      : ${{ env.SUFFIX }}"
          echo "  Cluster     : ${{ env.RUNAI_CLUSTER_ID }}"
          echo "  Project     : ${{ env.RUNAI_PROJECT }} ($PROJECT_ID)"
          echo "  Workloads   :"
          echo "    medw-chromadb${{ env.SUFFIX }}"
          echo "    medw-backend${{ env.SUFFIX }}"
          echo "    medw-frontend${{ env.SUFFIX }}"
          echo "    medw-ollama${{ env.SUFFIX }}  ← B200 GPU"
          echo "  Images      :"
          echo "    ${{ env.REGISTRY }}/${{ env.ORG }}/medw-chromadb:${{ env.IMMUTABLE_TAG }}"
          echo "    ${{ env.REGISTRY }}/${{ env.ORG }}/medw-backend:${{ env.IMMUTABLE_TAG }}"
          echo "    ${{ env.REGISTRY }}/${{ env.ORG }}/medw-frontend:${{ env.IMMUTABLE_TAG }}"
          echo "    ${{ env.REGISTRY }}/${{ env.ORG }}/medw-ollama:${{ env.IMMUTABLE_TAG }}"
          echo "  Ollama cfg  : model=${{ env.OLLAMA_MODEL }} timeout=${{ env.OLLAMA_TIMEOUT }} parallel=${{ env.OLLAMA_NUM_PARALLEL }} max_loaded=${{ env.OLLAMA_MAX_LOADED_MODELS }} flash=${{ env.OLLAMA_FLASH_ATTENTION }}"
          echo "  Warmup cfg  : enabled=${{ env.OLLAMA_WARMUP_ENABLED }} keep_alive=${{ env.OLLAMA_WARMUP_KEEP_ALIVE }} retries=${{ env.OLLAMA_WARMUP_RETRIES }} retry_delay=${{ env.OLLAMA_WARMUP_RETRY_DELAY_SECONDS }}s"
          echo "  URLs resolved at runtime via Run:ai API after workloads reach Running"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── Delete stale app workloads so the new image + env vars take effect ─
      # Data services (ChromaDB, Ollama) are kept to preserve PVC state.
      # Backend + Frontend are always recreated.
      - name: Delete existing backend & frontend workloads
        run: |
          delete_workload() {
            local name="$1"
            echo "Deleting workload: $name"
            # Find workload ID by name
            RESP=$(curl -sSL "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads?limit=100" \
              -H "Authorization: Bearer $TOKEN")
            WL_ID=$(echo "$RESP" | jq -r ".workloads // . | .[] | select(.name == \"$name\") | .id // empty")
            if [ -z "$WL_ID" ] || [ "$WL_ID" = "null" ]; then
              echo "  $name not found — nothing to delete"
              return 0
            fi
            DEL_RESP=$(curl -sSL -w "\n%{http_code}" -X DELETE \
              "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads/workspaces/$WL_ID" \
              -H "Authorization: Bearer $TOKEN") || true
            DEL_STATUS=$(echo "$DEL_RESP" | tail -1)
            echo "  $name deleted (HTTP $DEL_STATUS)"
            # Wait for workload to fully terminate
            for i in $(seq 1 30); do
              CHECK=$(curl -sSL "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads?limit=100" \
                -H "Authorization: Bearer $TOKEN" | jq -r ".workloads // . | .[] | select(.name == \"$name\") | .phase // empty")
              if [ -z "$CHECK" ]; then
                echo "  $name fully removed"
                return 0
              fi
              echo "  [$i] $name phase: $CHECK — waiting..."
              sleep 5
            done
            echo "  WARNING: $name not fully removed after 150s — proceeding anyway"
          }

          delete_workload "medw-backend${SUFFIX}"
          delete_workload "medw-frontend${SUFFIX}"

      # ── Submit workloads via REST API ────────────────────────────────────
      # Deploy in dependency order: data services → backend → frontend.
      # After each tier, resolve the auto-assigned NodePort URLs from the
      # Run:ai API and pass them to downstream workloads as env vars.
      - name: Deploy ChromaDB
        run: |
          CHROMA_JSON=$(jq -n \
            --arg name "medw-chromadb${SUFFIX}" \
            --arg projectId "$PROJECT_ID" \
            --arg clusterId "${{ env.RUNAI_CLUSTER_ID }}" \
            --arg image "${{ env.REGISTRY }}/${{ env.ORG }}/medw-chromadb:${IMMUTABLE_TAG}" \
            --arg pvc "chroma-pvc${SUFFIX}" \
            '{
              name: $name,
              projectId: $projectId,
              clusterId: $clusterId,
              spec: {
                image: $image,
                compute: { cpuCoreRequest: 1, cpuCoreLimit: 1, cpuMemoryRequest: "2G", cpuMemoryLimit: "2G" },
                environmentVariables: [
                  {name: "IS_PERSISTENT", value: "TRUE"},
                  {name: "ANONYMIZED_TELEMETRY", value: "FALSE"},
                  {name: "CHROMA_SERVER_PORT", value: "8000"}
                ],
                ports: [{container: 8000, serviceType: "NodePort"}],
                storage: {
                  pvc: [{
                    path: "/chroma/chroma",
                    claimName: $pvc,
                    existingPvc: false,
                    claimInfo: { size: "10Gi" }
                  }]
                }
              }
            }')
          RESP=$(curl -sSL -w "\n%{http_code}" -X POST \
            "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads/workspaces" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d "$CHROMA_JSON") || true
          STATUS=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "ChromaDB response (HTTP $STATUS): $BODY"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
            echo "ChromaDB submitted"
          elif [ "$STATUS" = "409" ]; then
            echo "ChromaDB already exists — skipping"
          else
            echo "ChromaDB failed (HTTP $STATUS): $BODY" && exit 1
          fi

      - name: Deploy Ollama (B200 GPU)
        run: |
          OLLAMA_JSON=$(jq -n \
            --arg name "medw-ollama${SUFFIX}" \
            --arg projectId "$PROJECT_ID" \
            --arg clusterId "${{ env.RUNAI_CLUSTER_ID }}" \
            --arg image "${{ env.REGISTRY }}/${{ env.ORG }}/medw-ollama:${IMMUTABLE_TAG}" \
            --arg pvc "ollama-pvc${SUFFIX}" \
            --arg cmd "/bin/sh" \
            --arg cmdargs "-c 'ollama serve & sleep 10 && ollama pull ${OLLAMA_MODEL} && wait'" \
            --arg ollamaModel "${OLLAMA_MODEL}" \
            --arg ollamaFlashAttention "${OLLAMA_FLASH_ATTENTION}" \
            --arg ollamaNumParallel "${OLLAMA_NUM_PARALLEL}" \
            --arg ollamaMaxLoadedModels "${OLLAMA_MAX_LOADED_MODELS}" \
            '{
              name: $name,
              projectId: $projectId,
              clusterId: $clusterId,
              spec: {
                image: $image,
                compute: {
                  cpuCoreRequest: 24, cpuCoreLimit: 24,
                  cpuMemoryRequest: "96G", cpuMemoryLimit: "96G",
                  gpuDevicesRequest: 3
                },
                environmentVariables: [
                  {name: "OLLAMA_MODEL", value: $ollamaModel},
                  {name: "OLLAMA_FLASH_ATTENTION", value: $ollamaFlashAttention},
                  {name: "OLLAMA_NUM_PARALLEL", value: $ollamaNumParallel},
                  {name: "OLLAMA_MAX_LOADED_MODELS", value: $ollamaMaxLoadedModels},
                  {name: "OLLAMA_KEEP_ALIVE", value: "-1"}
                ],
                command: $cmd,
                args: $cmdargs,
                ports: [{container: 11434, serviceType: "NodePort"}],
                storage: {
                  pvc: [{
                    path: "/root/.ollama",
                    claimName: $pvc,
                    existingPvc: false,
                    claimInfo: { size: "100Gi" }
                  }]
                }
              }
            }')
          RESP=$(curl -sSL -w "\n%{http_code}" -X POST \
            "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads/workspaces" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d "$OLLAMA_JSON") || true
          STATUS=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "Ollama response (HTTP $STATUS): $BODY"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
            echo "Ollama submitted"
          elif [ "$STATUS" = "409" ]; then
            echo "Ollama already exists — skipping"
          else
            echo "Ollama failed (HTTP $STATUS): $BODY" && exit 1
          fi

      # ── Resolve data-service URLs from Run:ai API ─────────────────────────
      # Run:ai does not support fixed NodePorts — poll until Running then
      # extract the assigned NodePort from the workload's URL field.
      - name: Resolve ChromaDB and Ollama URLs
        run: |
          resolve_url() {
            local workload_name="$1"
            local scheme="${2:-http}"
            local max_attempts=120
            echo "━━━ Resolving URL for $workload_name ━━━" >&2
            for i in $(seq 1 $max_attempts); do
              local resp=$(curl -sSL "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads?limit=100" \
                -H "Authorization: Bearer $TOKEN")
              local workload=$(echo "$resp" | jq ".workloads // . | .[] | select(.name == \"$workload_name\")")
              if [ -z "$workload" ] || [ "$workload" = "null" ]; then
                echo "  [$i] $workload_name not found yet" >&2; sleep 5; continue
              fi
              local phase=$(echo "$workload" | jq -r '.phase // "Unknown"')
              echo "  [$i] $workload_name phase: $phase" >&2
              if [ "$phase" = "Running" ]; then
                local ip_port=$(echo "$workload" | jq -r '.urls[0] // .environments[0].connections[0].url // empty')
                if [ -n "$ip_port" ] && [ "$ip_port" != "null" ]; then
                  echo "  Resolved $workload_name → ${scheme}://${ip_port}" >&2
                  echo "${scheme}://${ip_port}"; return 0
                fi
                echo "  ERROR: Running but no URL in workload JSON" >&2
                echo "$workload" | jq '.' >&2; return 1
              fi
              sleep 5
            done
            echo "  ERROR: $workload_name timed out" >&2; return 1
          }

          CHROMA_URL=$(resolve_url "medw-chromadb${SUFFIX}") || CHROMA_URL=""
          OLLAMA_URL=$(resolve_url "medw-ollama${SUFFIX}") || OLLAMA_URL=""
          [ -z "$CHROMA_URL" ] && CHROMA_URL="${{ vars.CHROMA_URL }}"
          [ -z "$OLLAMA_URL" ] && OLLAMA_URL="${{ vars.OLLAMA_URL }}"
          if [ -z "$CHROMA_URL" ] || [ -z "$OLLAMA_URL" ]; then
            echo "Failed to resolve service URLs"; exit 1
          fi
          echo "CHROMA_URL=$CHROMA_URL" >> "$GITHUB_ENV"
          echo "OLLAMA_URL=$OLLAMA_URL" >> "$GITHUB_ENV"
          echo "Resolved CHROMA_URL=$CHROMA_URL"
          echo "Resolved OLLAMA_URL=$OLLAMA_URL"

      - name: Deploy Backend
        run: |
          CHROMA_HOST_VAL=$(echo "$CHROMA_URL" | sed -E 's|https?://||; s|:[0-9]+$||')
          CHROMA_PORT_VAL=$(echo "$CHROMA_URL" | sed -E 's|.*:([0-9]+)$|\1|')
          BACKEND_JSON=$(jq -n \
            --arg name "medw-backend${SUFFIX}" \
            --arg projectId "$PROJECT_ID" \
            --arg clusterId "${{ env.RUNAI_CLUSTER_ID }}" \
            --arg image "${{ env.REGISTRY }}/${{ env.ORG }}/medw-backend:${IMMUTABLE_TAG}" \
            --arg ollamaUrl "$OLLAMA_URL" \
            --arg ollamaModel "${OLLAMA_MODEL}" \
            --arg ollamaTimeout "${OLLAMA_TIMEOUT}" \
            --arg ollamaWarmupEnabled "${OLLAMA_WARMUP_ENABLED}" \
            --arg ollamaWarmupKeepAlive "${OLLAMA_WARMUP_KEEP_ALIVE}" \
            --arg ollamaWarmupRetries "${OLLAMA_WARMUP_RETRIES}" \
            --arg ollamaWarmupRetryDelaySeconds "${OLLAMA_WARMUP_RETRY_DELAY_SECONDS}" \
            --arg chromaHost "$CHROMA_HOST_VAL" \
            --arg chromaPort "$CHROMA_PORT_VAL" \
            '{
              name: $name,
              projectId: $projectId,
              clusterId: $clusterId,
              spec: {
                image: $image,
                compute: { cpuCoreRequest: 1, cpuCoreLimit: 1, cpuMemoryRequest: "1G", cpuMemoryLimit: "1G" },
                environmentVariables: [
                  {name: "OLLAMA_HOST", value: $ollamaUrl},
                  {name: "OLLAMA_MODEL", value: $ollamaModel},
                  {name: "OLLAMA_TIMEOUT", value: $ollamaTimeout},
                  {name: "OLLAMA_WARMUP_ENABLED", value: $ollamaWarmupEnabled},
                  {name: "OLLAMA_WARMUP_KEEP_ALIVE", value: $ollamaWarmupKeepAlive},
                  {name: "OLLAMA_WARMUP_RETRIES", value: $ollamaWarmupRetries},
                  {name: "OLLAMA_WARMUP_RETRY_DELAY_SECONDS", value: $ollamaWarmupRetryDelaySeconds},
                  {name: "CHROMA_HOST", value: $chromaHost},
                  {name: "CHROMA_PORT", value: $chromaPort}
                ],
                ports: [{container: 8000, serviceType: "NodePort"}]
              }
            }')
          RESP=$(curl -sSL -w "\n%{http_code}" -X POST \
            "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads/workspaces" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d "$BACKEND_JSON") || true
          STATUS=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "Backend response (HTTP $STATUS): $BODY"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
            echo "Backend submitted"
          elif [ "$STATUS" = "409" ]; then
            echo "Backend already exists — skipping (delete it to apply new env vars)"
          else
            echo "Backend failed (HTTP $STATUS): $BODY" && exit 1
          fi

      - name: Resolve Backend URL
        run: |
          resolve_url() {
            local workload_name="$1"
            local scheme="${2:-http}"
            local max_attempts=120
            echo "━━━ Resolving URL for $workload_name ━━━" >&2
            for i in $(seq 1 $max_attempts); do
              local resp=$(curl -sSL "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads?limit=100" \
                -H "Authorization: Bearer $TOKEN")
              local workload=$(echo "$resp" | jq ".workloads // . | .[] | select(.name == \"$workload_name\")")
              if [ -z "$workload" ] || [ "$workload" = "null" ]; then
                sleep 5; continue
              fi
              local phase=$(echo "$workload" | jq -r '.phase // "Unknown"')
              echo "  [$i] $workload_name phase: $phase" >&2
              if [ "$phase" = "Running" ]; then
                local ip_port=$(echo "$workload" | jq -r '.urls[0] // .environments[0].connections[0].url // empty')
                if [ -n "$ip_port" ] && [ "$ip_port" != "null" ]; then
                  echo "  Resolved $workload_name → ${scheme}://${ip_port}" >&2
                  echo "${scheme}://${ip_port}"; return 0
                fi
                echo "  ERROR: Running but no URL in workload JSON" >&2
                echo "$workload" | jq '.' >&2; return 1
              fi
              sleep 5
            done
            echo "  ERROR: $workload_name timed out" >&2; return 1
          }

          BACKEND_URL=$(resolve_url "medw-backend${SUFFIX}") || BACKEND_URL=""
          [ -z "$BACKEND_URL" ] && BACKEND_URL="${{ vars.BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "Failed to resolve backend URL"; exit 1
          fi
          echo "BACKEND_URL=$BACKEND_URL" >> "$GITHUB_ENV"
          echo "Resolved BACKEND_URL=$BACKEND_URL"

          # Persist the resolved URL back to the GitHub environment variable so
          # future deploys always have a correct fallback (and /api/config is never stale).
          ENV_NAME="${{ needs.setup.outputs.env }}"
          REPO="${{ github.repository }}"
          GH_API="https://api.github.com/repos/${REPO}/environments/${ENV_NAME}/variables/BACKEND_URL"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "$GH_API" -d "{\"name\":\"BACKEND_URL\",\"value\":\"${BACKEND_URL}\"}")
          if [ "$HTTP" = "404" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/environments/${ENV_NAME}/variables" \
              -d "{\"name\":\"BACKEND_URL\",\"value\":\"${BACKEND_URL}\"}"
          fi
          echo "GitHub variable BACKEND_URL updated to $BACKEND_URL (HTTP $HTTP)"

      - name: Deploy Frontend
        run: |
          FRONTEND_JSON=$(jq -n \
            --arg name "medw-frontend${SUFFIX}" \
            --arg projectId "$PROJECT_ID" \
            --arg clusterId "${{ env.RUNAI_CLUSTER_ID }}" \
            --arg image "${{ env.REGISTRY }}/${{ env.ORG }}/medw-frontend:${IMMUTABLE_TAG}" \
            --arg backendUrl "$BACKEND_URL" \
            '{
              name: $name,
              projectId: $projectId,
              clusterId: $clusterId,
              spec: {
                image: $image,
                compute: { cpuCoreRequest: 1, cpuCoreLimit: 1, cpuMemoryRequest: "512M", cpuMemoryLimit: "512M" },
                environmentVariables: [
                  {name: "BACKEND_URL", value: $backendUrl}
                ],
                ports: [{container: 3000, serviceType: "NodePort"}]
              }
            }')
          RESP=$(curl -sSL -w "\n%{http_code}" -X POST \
            "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads/workspaces" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d "$FRONTEND_JSON") || true
          STATUS=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "Frontend response (HTTP $STATUS): $BODY"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
            echo "Frontend submitted"
          elif [ "$STATUS" = "409" ]; then
            echo "Frontend already exists — skipping (delete it to apply new BACKEND_URL)"
          else
            echo "Frontend failed (HTTP $STATUS): $BODY" && exit 1
          fi

      # ── Status ────────────────────────────────────────────────────────────
      - name: Show workload status
        if: always()
        run: |
          curl -fsSL "${{ env.RUNAI_CLUSTER_URL }}/api/v1/workloads?limit=50" \
            -H "Authorization: Bearer $TOKEN" \
            | jq '.workloads // . | if type == "array" then .[] | select(.name | startswith("medw-")) | {name, phase} else . end'
