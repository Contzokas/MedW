name: medw

networks:
  medw-internal:
    # Internal network: ollama and chromadb ports are not published to host (NFR5, NFR7, NFR20)
  medw-external:
    # External network: backend and frontend exposed to host

services:
  ollama:
    image: ollama/ollama:latest
    container_name: medw-ollama
    networks:
      - medw-internal
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral:7b}
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"${OLLAMA_MODEL:-mistral:7b}\" || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 600s  # 10 min — model pull on first run can take time
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  chromadb:
    image: chromadb/chroma:1.5.7
    container_name: medw-chromadb
    networks:
      - medw-internal
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_SERVER_PORT=8000
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medw-backend
    networks:
      - medw-internal
      - medw-external
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      chromadb:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: medw-frontend
    networks:
      - medw-external
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
  chroma_data:
