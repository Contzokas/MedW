name: medw

networks:
  medw-internal:
    # Internal network: nim and chromadb ports are not published to host (NFR5, NFR7, NFR20)
  medw-external:
    # External network: backend and frontend exposed to host

services:
  nim:
    image: nvcr.io/nim/nvidia/nemotron-3-super-120b-a12b:latest
    container_name: medw-nim
    networks:
      - medw-internal
    volumes:
      - nim_cache:/opt/nim/.cache
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/health/ready || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 600s  # 10 min — model engine optimisation on first run
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  chromadb:
    image: chromadb/chroma:1.5.7
    container_name: medw-chromadb
    networks:
      - medw-internal
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_SERVER_PORT=8000
    depends_on:
      nim:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medw-backend
    networks:
      - medw-internal
      - medw-external
    ports:
      - "8000:8000"
    environment:
      - NIM_BASE_URL=http://nim:8000/v1
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      chromadb:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medw-frontend
    networks:
      - medw-external
    ports:
      - "3000:3000"
    environment:
      # Server-side proxy target for Next.js rewrites
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nim_cache:
  chroma_data:
