apiVersion: apps/v1
kind: Deployment
metadata:
  name: medw-frontend
  namespace: runai-medo
  labels:
    app: medw-frontend
    app.kubernetes.io/part-of: medw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medw-frontend
  template:
    metadata:
      labels:
        app: medw-frontend
    spec:
      containers:
        - name: frontend
          # Replace with your actual GHCR image after CI builds it:
          # ghcr.io/medw/medw-frontend:latest
          image: ghcr.io/medw/medw-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            # NEXT_PUBLIC_API_URL is baked at build time (see CI workflow).
            # At runtime this env var is informational only, but we set it
            # consistently in case the app reads it server-side.
            - name: NEXT_PUBLIC_API_URL
              value: "http://backend:8000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: runai-medo
  labels:
    app: medw-frontend
    app.kubernetes.io/part-of: medw
spec:
  selector:
    app: medw-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      # nodePort is auto-assigned; pin it here (30000–32767) if you need a stable port:
      # nodePort: 30300
  type: NodePort   # exposes the frontend on every cluster node's IP
