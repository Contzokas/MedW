apiVersion: apps/v1
kind: Deployment
metadata:
  name: medw-backend
  namespace: runai-medo
  labels:
    app: medw-backend
    app.kubernetes.io/part-of: medw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medw-backend
  template:
    metadata:
      labels:
        app: medw-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/contzokas/medw-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: NIM_BASE_URL
              value: "http://nim:8000/v1"
            - name: NIM_MODEL
              value: "nvidia/nemotron-3-super-120b-a12b"
            - name: NIM_TIMEOUT
              value: "120"
            - name: NIM_EMBED_BASE_URL
              value: "http://nim-embed:8000/v1"
            - name: NIM_EMBED_MODEL
              value: "nvidia/nv-embedqa-llama-3_2-1b-v2"
            - name: NIM_RERANKER_BASE_URL
              value: "https://integrate.api.nvidia.com/v1"
            - name: NIM_RERANKER_MODEL
              value: "nvidia/nv-rerankqa-llama-3_2-1b-v2"
            - name: MILVUS_URI
              value: "/data/milvus.db"
            - name: QUEUE_MAX_ENTRIES
              value: "1000"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: backend-data
              mountPath: /data
      volumes:
        - name: backend-data
          persistentVolumeClaim:
            claimName: backend-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: runai-medo
  labels:
    app: medw-backend
    app.kubernetes.io/part-of: medw
spec:
  selector:
    app: medw-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
