apiVersion: apps/v1
kind: Deployment
metadata:
  name: medw-backend
  namespace: runai-medo
  labels:
    app: medw-backend
    app.kubernetes.io/part-of: medw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medw-backend
  template:
    metadata:
      labels:
        app: medw-backend
    spec:
      containers:
        - name: backend
          # Replace with your actual GHCR image after CI builds it:
          # ghcr.io/medw/medw-backend:latest
          image: ghcr.io/contzokas/medw-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: OLLAMA_HOST
              value: "http://ollama:11434"
            - name: OLLAMA_MODEL
              value: "medgemma:27b"
            - name: OLLAMA_TIMEOUT
              value: "120"
            - name: CHROMA_HOST
              value: "chromadb"
            - name: CHROMA_PORT
              value: "8000"
            - name: QUEUE_MAX_ENTRIES
              value: "1000"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: runai-medo
  labels:
    app: medw-backend
    app.kubernetes.io/part-of: medw
spec:
  selector:
    app: medw-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
