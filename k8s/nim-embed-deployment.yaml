# NIM Embedding — fractional GPU workload (Run:ai scheduled)
#
# Model: nvidia/nv-embedqa-llama-3_2-1b-v2  (NeMo Retriever)
# Shares GPU 0 (1× B200) with nim-reranker via Run:ai fractional scheduling.
# ~2 GB weights at FP8 — trivially small on a 192 GB B200.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: medw-nim-embed
  namespace: runai-medo
  labels:
    app: medw-nim-embed
    app.kubernetes.io/part-of: medw
    gpu-type: b200
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medw-nim-embed
  template:
    metadata:
      labels:
        app: medw-nim-embed
        gpu-type: b200
      annotations:
        scheduling.run.ai/fraction: "0.2"
    spec:
      schedulerName: runai-scheduler

      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-B200

      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"

      imagePullSecrets:
        - name: dockerregistry-nvcr-io

      containers:
        - name: nim-embed
          image: nvcr.io/nim/nvidia/nv-embedqa-llama-3_2-1b-v2:latest
          ports:
            - containerPort: 8000
              name: nim-embed-api

          env:
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: genericsecret-ngc
                  key: NGC_API_KEY
            - name: NIM_CACHE_PATH
              value: "/opt/nim/.cache"

          resources:
            requests:
              memory: "8Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "2"
              nvidia.com/gpu: 1

          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5

          volumeMounts:
            - name: nim-embed-cache
              mountPath: /opt/nim/.cache

      volumes:
        - name: nim-embed-cache
          persistentVolumeClaim:
            claimName: nim-embed-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nim-embed
  namespace: runai-medo
  labels:
    app: medw-nim-embed
    app.kubernetes.io/part-of: medw
spec:
  selector:
    app: medw-nim-embed
  ports:
    - name: nim-embed-api
      port: 8000
      targetPort: 8000
  type: ClusterIP
