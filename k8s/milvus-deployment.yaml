# Milvus Standalone — etcd + MinIO + Milvus
#
# GPU split across 3× B200:
#   GPU 0 (full):   nim-embed  (defined in nim-embed-deployment.yaml)
#   GPU 1+2 (full): LLM tensor parallel (defined in nim-deployment.yaml)
#   CPU only:       Milvus, nim-reranker

# ---------------------------------------------------------------------------
# etcd — metadata store for Milvus
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medw-milvus-etcd
  namespace: runai-medo
  labels:
    app: medw-milvus-etcd
    app.kubernetes.io/part-of: medw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medw-milvus-etcd
  template:
    metadata:
      labels:
        app: medw-milvus-etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.14
          command:
            - etcd
            - --auto-compaction-mode=revision
            - --auto-compaction-retention=1000
            - --quota-backend-bytes=4294967296
            - --snapshot-count=50000
            - --data-dir=/etcd
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://milvus-etcd:2379
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["etcdctl", "endpoint", "health"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd
      volumes:
        - name: etcd-data
          persistentVolumeClaim:
            claimName: milvus-etcd-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: milvus-etcd
  namespace: runai-medo
  labels:
    app: medw-milvus-etcd
    app.kubernetes.io/part-of: medw
spec:
  selector:
    app: medw-milvus-etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
  type: ClusterIP
---
# ---------------------------------------------------------------------------
# MinIO — object storage for Milvus segment data
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medw-milvus-minio
  namespace: runai-medo
  labels:
    app: medw-milvus-minio
    app.kubernetes.io/part-of: medw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medw-milvus-minio
  template:
    metadata:
      labels:
        app: medw-milvus-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-05-10T01-41-38Z
          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ACCESS_KEY
              value: "minioadmin"
            - name: MINIO_SECRET_KEY
              value: "minioadmin"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: milvus-minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: milvus-minio
  namespace: runai-medo
  labels:
    app: medw-milvus-minio
    app.kubernetes.io/part-of: medw
spec:
  selector:
    app: medw-milvus-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  type: ClusterIP
---
# ---------------------------------------------------------------------------
# Milvus Standalone — CPU only (no GPU required for HNSW index)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medw-milvus
  namespace: runai-medo
  labels:
    app: medw-milvus
    app.kubernetes.io/part-of: medw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medw-milvus
  template:
    metadata:
      labels:
        app: medw-milvus
    spec:
      initContainers:
        - name: wait-for-etcd
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z milvus-etcd 2379; do sleep 2; done"]
        - name: wait-for-minio
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z milvus-minio 9000; do sleep 2; done"]

      containers:
        - name: milvus
          image: milvusdb/milvus:v2.5.0
          command: ["milvus", "run", "standalone"]
          env:
            - name: ETCD_ENDPOINTS
              value: "milvus-etcd:2379"
            - name: MINIO_ADDRESS
              value: "milvus-minio:9000"
            - name: MINIO_ACCESS_KEY_ID
              value: "minioadmin"
            - name: MINIO_SECRET_ACCESS_KEY
              value: "minioadmin"
          ports:
            - containerPort: 19530
              name: grpc
            - containerPort: 9091
              name: metrics
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "4"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: milvus-data
              mountPath: /var/lib/milvus

      volumes:
        - name: milvus-data
          persistentVolumeClaim:
            claimName: milvus-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: runai-medo
  labels:
    app: medw-milvus
    app.kubernetes.io/part-of: medw
spec:
  selector:
    app: medw-milvus
  ports:
    - name: grpc
      port: 19530
      targetPort: 19530
    - name: metrics
      port: 9091
      targetPort: 9091
  type: ClusterIP
